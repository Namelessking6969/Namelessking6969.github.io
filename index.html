<div id="terminal">
  <pre id="output"></pre>
  <div class="line">
    <span class="prompt">$</span>
    <input id="input" autofocus autocomplete="off" />
  </div>
</div>

<script>
const output = document.getElementById("output");
const input = document.getElementById("input");

const commands = {
  help: `
available commands:
- help
- whoami
- projects
- logs
- clear
  `,
  whoami: `
name: namelessking
role: builder / experimenter
status: online
  `,
  projects: `
- github.io site
- terminal interface (this)
- experimental builds
  `,
  logs: `
[2026-04-30] system migrated
[2026-04-30] terminal interface enabled
  `
};

function write(text) {
  output.textContent += text + "\n";
}

input.addEventListener("keydown", (e) => {
  if (e.key === "Enter") {
    const cmd = input.value.trim();
    write("$ " + cmd);

    if (cmd === "clear") {
      output.textContent = "";
    } else if (commands[cmd]) {
      write(commands[cmd]);
    } else {
      write("command not found: " + cmd);
    }

    input.value = "";
  }
});
</script>
