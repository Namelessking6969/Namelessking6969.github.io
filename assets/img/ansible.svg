<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#667eea;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#764ba2;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="wizardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#f093fb;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#f5576c;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Background -->
  <rect width="800" height="600" fill="url(#bgGrad)" />
  
  <!-- Title -->
  <text x="400" y="50" font-family="Arial, sans-serif" font-size="42" font-weight="bold" fill="white" text-anchor="middle">Ansible</text>
  <text x="400" y="90" font-family="Arial, sans-serif" font-size="20" fill="white" text-anchor="middle" opacity="0.9">Automation Magic</text>
  
  <!-- Wizard -->
  <g transform="translate(200, 200)">
    <!-- Wizard body -->
    <ellipse cx="0" cy="80" rx="50" ry="60" fill="url(#wizardGrad)" />
    <!-- Wizard hat -->
    <path d="M -30 -40 L 0 -120 L 30 -40 Z" fill="#4a00e0" />
    <rect x="-40" y="-50" width="80" height="15" rx="5" fill="#4a00e0" />
    <!-- Stars on hat -->
    <circle cx="-15" cy="-80" r="4" fill="#ffd700" />
    <circle cx="10" cy="-90" r="3" fill="#ffd700" />
    <!-- Face -->
    <circle cx="-12" cy="-5" r="5" fill="white" />
    <circle cx="12" cy="-5" r="5" fill="white" />
    <circle cx="-12" cy="-5" r="2" fill="black" />
    <circle cx="12" cy="-5" r="2" fill="black" />
    <path d="M -8 10 Q 0 18 8 10" stroke="white" stroke-width="3" fill="none" />
    <!-- Beard -->
    <ellipse cx="0" cy="25" rx="20" ry="25" fill="#e0e0e0" />
    <!-- Staff -->
    <line x1="45" y1="-30" x2="55" y2="120" stroke="#8B4513" stroke-width="6" />
    <circle cx="50" cy="-40" r="12" fill="#ffd700" />
    <circle cx="50" cy="-40" r="8" fill="#fff176" opacity="0.6">
      <animate attributeName="r" values="8;12;8" dur="2s" repeatCount="indefinite" />
    </circle>
  </g>
  
  <!-- Spell lines -->
  <g opacity="0.6">
    <path d="M 250 220 Q 350 180 450 220" stroke="white" stroke-width="3" fill="none" stroke-dasharray="10,5">
      <animate attributeName="stroke-dashoffset" values="0;30" dur="1s" repeatCount="indefinite" />
    </path>
    <path d="M 250 260 Q 350 220 450 260" stroke="white" stroke-width="3" fill="none" stroke-dasharray="10,5">
      <animate attributeName="stroke-dashoffset" values="30;0" dur="1s" repeatCount="indefinite" />
    </path>
    <path d="M 250 300 Q 350 260 450 300" stroke="white" stroke-width="3" fill="none" stroke-dasharray="10,5">
      <animate attributeName="stroke-dashoffset" values="0;30" dur="1s" repeatCount="indefinite" />
    </path>
  </g>
  
  <!-- Server 1 -->
  <g transform="translate(500, 180)">
    <rect x="-50" y="-40" width="100" height="80" rx="8" fill="#2d3748" stroke="#4fd1c5" stroke-width="3" />
    <rect x="-35" y="-25" width="70" height="8" rx="4" fill="#4fd1c5" opacity="0.8" />
    <rect x="-35" y="-10" width="70" height="8" rx="4" fill="#4fd1c5" opacity="0.6" />
    <rect x="-35" y="5" width="50" height="8" rx="4" fill="#4fd1c5" opacity="0.4" />
    <circle cx="35" cy="-25" r="5" fill="#48bb78">
      <animate attributeName="fill" values="#48bb78;#f56565;#48bb78" dur="2s" repeatCount="indefinite" />
    </circle>
    <text x="0" y="45" font-family="Arial" font-size="14" fill="white" text-anchor="middle">Server 1</text>
  </g>
  
  <!-- Server 2 -->
  <g transform="translate(500, 300)">
    <rect x="-50" y="-40" width="100" height="80" rx="8" fill="#2d3748" stroke="#4fd1c5" stroke-width="3" />
    <rect x="-35" y="-25" width="70" height="8" rx="4" fill="#4fd1c5" opacity="0.8" />
    <rect x="-35" y="-10" width="70" height="8" rx="4" fill="#4fd1c5" opacity="0.6" />
    <rect x="-35" y="5" width="50" height="8" rx="4" fill="#4fd1c5" opacity="0.4" />
    <circle cx="35" cy="-25" r="5" fill="#48bb78">
      <animate attributeName="fill" values="#48bb78;#f56565;#48bb78" dur="2s" begin="0.5s" repeatCount="indefinite" />
    </circle>
    <text x="0" y="45" font-family="Arial" font-size="14" fill="white" text-anchor="middle">Server 2</text>
  </g>
  
  <!-- Server 3 -->
  <g transform="translate(500, 420)">
    <rect x="-50" y="-40" width="100" height="80" rx="8" fill="#2d3748" stroke="#4fd1c5" stroke-width="3" />
    <rect x="-35" y="-25" width="70" height="8" rx="4" fill="#4fd1c5" opacity="0.8" />
    <rect x="-35" y="-10" width="70" height="8" rx="4" fill="#4fd1c5" opacity="0.6" />
    <rect x="-35" y="5" width="50" height="8" rx="4" fill="#4fd1c5" opacity="0.4" />
    <circle cx="35" cy="-25" r="5" fill="#48bb78">
      <animate attributeName="fill" values="#48bb78;#f56565;#48bb78" dur="2s" begin="1s" repeatCount="indefinite" />
    </circle>
    <text x="0" y="45" font-family="Arial" font-size="14" fill="white" text-anchor="middle">Server 3</text>
  </g>
  
  <!-- Checkmarks -->
  <g transform="translate(450, 180)">
    <text x="0" y="5" font-size="24" fill="#48bb78">✓</text>
  </g>
  <g transform="translate(450, 300)">
    <text x="0" y="5" font-size="24" fill="#48bb78">✓</text>
  </g>
  <g transform="translate(450, 420)">
    <text x="0" y="5" font-size="24" fill="#48bb78">✓</text>
  </g>
  
  <!-- Bottom text -->
  <text x="400" y="550" font-family="Arial, sans-serif" font-size="16" fill="white" text-anchor="middle" opacity="0.8">One command → Many servers</text>
</svg>