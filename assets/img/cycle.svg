<svg xmlns="http://www.w3.org/2000/svg" width="800" height="400" viewBox="0 0 800 400">
  <defs>
    <linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#2c3e50;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1a252f;stop-opacity:1" />
    </linearGradient>
  </defs>
  <rect width="800" height="400" rx="12" fill="url(#grad)"/>
  <text x="400" y="180" font-family="Arial, sans-serif" font-size="50" font-weight="bold" fill="white" text-anchor="middle">Never-Ending Cycle</text>
  <text x="400" y="240" font-family="Arial, sans-serif" font-size="24" fill="rgba(255,255,255,0.9)" text-anchor="middle">Round and round you go</text>
  <text x="400" y="300" font-family="Arial, sans-serif" font-size="60" text-anchor="middle">🔄</text>
</svg>